<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/auth.css">
    <title>Авторизация</title>

    
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1 class="title">
            Система оплаты
        </h1>

        <p class="subtitle">
            Авторизация и регистрация
        </p>

        <div class="tabs">
            <button id="loginTab" class="tab-btn active">
                Вход
            </button>

            <button id="registerTab" class="tab-btn">
                Регистрация
            </button>
        </div>

        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Введите email"
                    required
                />
            </div>

            <div class="form-group">
                <label>Пароль</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Введите пароль"
                    required
                />
            </div>

            <button class="submit-btn" type="submit">
                Войти
            </button>

        </form>

        <!-- REGISTER -->

        <form id="registerForm" class="hidden">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Введите email"
                    required
                />
            </div>

            <div class="form-group">
                <label>Пароль</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Введите пароль"
                    required
                />
            </div>

            <div class="form-group">
                <label>Подтверждение пароля</label>

                <input
                    type="password"
                    id="registerConfirmPassword"
                    placeholder="Повторите пароль"
                    required
                />
            </div>

            <button class="submit-btn" type="submit">
                Зарегистрироваться
            </button>

        </form>

        <div class="result-box" id="result">
            Ожидание действия...
        </div>

    </div>

</div>

<script src="../js/auth.js">
</script>

</body>
</html>
