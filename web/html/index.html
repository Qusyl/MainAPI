<!DOCTYPE html> 
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/index.css">

    <title>Payment</title>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Каскадирование платежей DEMO
        </div>

        <div class="nav-actions">

            <a href="../html/auth.html"
               class="login-btn"
               id="authButton">
                Войти
            </a>

        </div>

    </header>

    <div class="container">

        <div class="payment-card">

            <h1 class="title">
                Платеж
            </h1>

            <p class="subtitle">
                Каскадирование платежей demo
            </p>

            <form id="PaymentForm">

                <div class="form-group">

                    <label for="amount">
                        Сумма
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Введите сумму"
                        min="1"
                        required
                    />

                </div>

                <div class="form-group">

                    <label for="currency">
                        Валюта
                    </label>

                    <select id="currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                        <option value="GBP">GBP</option>
                    </select>

                </div>

                <button class="pay-btn" type="submit">
                    Оплатить
                </button>

            </form>

            <div class="result-box">

                <div class="result-title">
                    Результат
                </div>

                <div class="result-content" id="result">
                    Ожидание запроса...
                </div>

            </div>

        </div>

    </div>

    <script src="../js/index.js"></script>

</body>
</html>
